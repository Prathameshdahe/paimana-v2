# The web image's /etc/nginx/nginx.conf (Dockerfile.web), replacing the nginx image's default: the same worker,
# event and http basics, but no access_log of its own, so every request is logged exactly once, by the paimana
# format in nginx.conf.template (rendered into /etc/nginx/conf.d/paimana.conf, included below).

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    include /etc/nginx/conf.d/*.conf;
}
