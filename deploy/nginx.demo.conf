# PAIMANA demo web (Dockerfile.demo, target web; docker-compose.demo.yml): nginx.conf.template's locations, headers
# and limits on plain http, for http://localhost:8080 on the demo laptop. No TLS and so no HSTS; the sign-in and api
# limits are looser than production's (30 and 120 a minute against 10 and 60) because the demo switches roles with
# one click and one person clicks through every page. Copied as it is into
# /etc/nginx/conf.d/paimana.conf: no template, no variables to substitute.

server_tokens off;

limit_req_zone $binary_remote_addr zone=auth:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=chat:1m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;

map $request_uri $paimana_log_uri {
    "~^(?<paimana_log_path>[^?]*)\?(.*&)?token="  "$paimana_log_path?token=[redacted]";
    default                                        $request_uri;
}
log_format paimana '$remote_addr [$time_iso8601] "$request_method $paimana_log_uri $server_protocol" $status '
                   '$body_bytes_sent rt=$request_time rid=$request_id "$http_user_agent"';
access_log /dev/stdout paimana;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx is the only proxy: the api gets the address nginx saw, never a client-supplied chain (on Docker Desktop that
    # address is the network's gateway, which is inside TRUSTED_PROXIES, so an appended chain would let a client pick
    # its own address for the limits and the audit log)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_max_temp_file_size 16m;
    error_page 502 503 504 = @api_down;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass $api;
    }
    location = /api/chat {
        limit_req zone=chat burst=3 nodelay;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_pass $api;
    }
    location = /api/stream {
        limit_req zone=api burst=100 nodelay;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_pass $api;
    }
    location = /api/jobs/ingest {
        client_max_body_size 110m;
        limit_req zone=api burst=100 nodelay;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_pass $api;
    }
    location ~ ^/api/(projects/[^/]+/(brief|second-opinion)|jobs/scout|worker-runs/trigger)$ {
        limit_req zone=api burst=100 nodelay;
        proxy_read_timeout 300s;
        proxy_pass $api;
    }
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass $api;
    }
    # the API reference (API_DOCS=1 in the demo): /docs, /redoc and the schema they load. FastAPI's pages load Swagger
    # UI and ReDoc from cdn.jsdelivr.net with an inline script, so they get a CSP of their own (an add_header here
    # replaces the server's, hence the others repeated)
    location ~ ^/(docs|docs/oauth2-redirect|redoc|openapi\.json)$ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.redoc.ly; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        limit_req zone=api burst=100 nodelay;
        proxy_pass $api;
    }
    location @api_down {
        default_type application/json;
        return 503 '{"detail":"api unavailable"}';
    }

    location /assets/ {
        expires 1y;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
